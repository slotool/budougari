name: minrepo reports

on:
  workflow_dispatch:
    inputs:
      report_date:
        description: "Target date, blank = today in Japan"
        required: false
        default: ""
      collect_latest:
        description: "Fetch latest min-repo hall/report data"
        type: boolean
        required: true
        default: true
      collect_bonus:
        description: "Fetch missing Juggler BB/RB and diff machine pages"
        type: boolean
        required: true
        default: true
      delay_seconds:
        description: "Delay between min-repo requests"
        required: true
        default: "15"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Resolve target date
        shell: bash
        run: |
          if [ -n "${{ inputs.report_date }}" ]; then
            echo "TARGET_DATE=${{ inputs.report_date }}" >> "$GITHUB_ENV"
          else
            echo "TARGET_DATE=$(date +%F)" >> "$GITHUB_ENV"
          fi
          echo "DELAY_SECONDS=${{ inputs.delay_seconds }}" >> "$GITHUB_ENV"

      - name: Remove invalid SQLite file
        run: |
          if [ -f data/minrepo.sqlite ]; then
            python -c "import sqlite3; sqlite3.connect('data/minrepo.sqlite').execute('pragma schema_version').fetchone()" || rm -f data/minrepo.sqlite
          fi

      - name: Collect latest hall data
        if: ${{ inputs.collect_latest }}
        run: python minrepo_collect.py

      - name: Repair inferred report dates
        run: python repair_report_dates.py

      - name: Collect event sample pages
        if: ${{ inputs.collect_latest }}
        run: |
          python collect_event_details.py --hall パーラーゾーン姪浜 --ones 3,6,9 --weekdays 土,日 --limit-per-group 4
          python collect_event_details.py --hall アウトバーンブリッツ --ones 4,8 --limit-per-group 4

      - name: Repair dates after detail collection
        run: python repair_report_dates.py

      - name: Collect missing Juggler BB/RB and negative diff pages
        if: ${{ inputs.collect_bonus }}
        run: python collect_bonus_details.py --date "$TARGET_DATE" --delay "$DELAY_SECONDS"

      - name: Repair dates after bonus collection
        run: python repair_report_dates.py

      - name: Build reports
        run: |
          python backfill_events.py
          python analyze_minrepo.py
          python analyze_juggler_patterns.py
          python analyze_juggler.py --date "$TARGET_DATE" --out reports/juggler_today.md
          python analyze_juggler_patterns.py --hall アウトバーンブリッツ --out reports/outbound_juggler_pattern_analysis.md
          python analyze_juggler.py --hall アウトバーンブリッツ --date "$TARGET_DATE" --out reports/outbound_juggler_today.md
          python estimate_grapes.py --date "$TARGET_DATE" --out reports/grape_estimates.md
          python build_combined_report.py
          python build_site.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/minrepo.sqlite exports reports config.json
          git diff --cached --quiet || git commit -m "Update minrepo reports"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/deploy-pages@v4
