name: grape history followup analysis

on:
  workflow_dispatch:
    inputs:
      delay_seconds:
        description: "Fetch delay seconds"
        required: true
        default: "5"
      backfill_days:
        description: "Backfill days. Use 0 for latest only, 180 for about six months."
        required: true
        default: "0"
      max_new_reports:
        description: "Maximum new hall-date reports to collect in one run"
        required: true
        default: "20"
  push:
    branches:
      - main
    paths:
      - "grape_history_report.py"
      - ".github/workflows/grape-history.yml"
  schedule:
    - cron: "27 0 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: grape-history
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect and analyze grape history
        run: >
          python grape_history_report.py
          --delay "${{ github.event.inputs.delay_seconds || '5' }}"
          --min-games 0
          --backfill-days "${{ github.event.inputs.backfill_days || '0' }}"
          --max-new-reports "${{ github.event.inputs.max_new_reports || '20' }}"

      - name: Commit history outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports site
          git diff --cached --quiet || git commit -m "Update grape history analysis"
          git pull --rebase
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: site

      - uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
