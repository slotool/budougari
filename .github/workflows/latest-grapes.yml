name: latest grape estimates

on:
  workflow_dispatch:
    inputs:
      delay_seconds:
        description: "Fetch delay seconds"
        required: true
        default: "5"
  push:
    branches:
      - main
    paths:
      - "run_latest_grapes.py"
      - "latest_grape_report_impl.py"
      - "latest_grape_report_overrides.py"
      - "build_site.py"
      - ".github/workflows/latest-grapes.yml"
  schedule:
    # 08:00 / 08:30 / 09:00 / 09:30 / 09:45 JST = 23:00 / 23:30 / 00:00 / 00:30 / 00:45 UTC
    - cron: "0 23 * * *"
    - cron: "30 23 * * *"
    - cron: "0 0 * * *"
    - cron: "30 0 * * *"
    - cron: "45 0 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: latest-grapes
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect latest grape estimates
        run: python run_latest_grapes.py --delay "${{ github.event.inputs.delay_seconds || '5' }}"

      - name: Build site
        run: python build_site.py

      - name: Commit report outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports exports site
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "Update latest grape estimates"
            git pull --rebase -X theirs
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/deploy-pages@v4
