name: latest grape estimates

on:
  workflow_dispatch:
    inputs:
      delay_seconds:
        description: "Fetch delay seconds"
        required: true
        default: "10"
  schedule:
    - cron: "30 22 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect latest grape estimates
        run: python latest_grape_report.py --delay "${{ github.event.inputs.delay_seconds || '10' }}"

      - name: Build site
        run: python build_site.py

      - name: Commit report outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports exports site
          git diff --cached --quiet || git commit -m "Update latest grape estimates"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/deploy-pages@v4
