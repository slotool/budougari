name: daily juggler analysis and picks

on:
  workflow_dispatch:
    inputs:
      delay_seconds:
        description: "Fetch delay seconds"
        required: true
        default: "5"
      backfill_days:
        description: "Lookback window for missing reports"
        required: true
        default: "365"
      max_new_reports:
        description: "Maximum hall-date reports per checkpoint batch"
        required: true
        default: "30"
  push:
    branches:
      - main
    paths:
      - "juggler_daily.py"
      - ".github/workflows/juggler-daily.yml"
  schedule:
    # 10:05 JST
    - cron: "5 1 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: juggler-daily
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect and checkpoint history in batches
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for batch in $(seq 1 9); do
            if [[ -f data/juggler_history.csv ]]; then
              before=$(wc -l < data/juggler_history.csv)
            else
              before=0
            fi

            python juggler_daily.py \
              --delay "${{ github.event.inputs.delay_seconds || '5' }}" \
              --backfill-days "${{ github.event.inputs.backfill_days || '365' }}" \
              --max-new-reports "${{ github.event.inputs.max_new_reports || '30' }}"
            python build_site.py
            after=$(wc -l < data/juggler_history.csv)

            git add data/juggler_history.csv data/juggler_predictions.csv
            git add reports/juggler_analysis.md reports/juggler_picks.md
            git add site/juggler_analysis.html site/juggler_picks.html site/index.html
            if ! git diff --cached --quiet; then
              git commit -m "Backfill Juggler history batch ${batch}"
              git pull --rebase -X theirs
              git push
            fi

            echo "batch=${batch} rows_before=${before} rows_after=${after}"
            if [[ "${after}" -le "${before}" ]]; then
              break
            fi
          done

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/deploy-pages@v4
