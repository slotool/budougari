name: daily juggler analysis and picks

on:
  workflow_dispatch:
    inputs:
      delay_seconds:
        description: "Fetch delay seconds"
        required: true
        default: "5"
      backfill_days:
        description: "Lookback window for missing reports"
        required: true
        default: "365"
      max_new_reports:
        description: "Maximum hall-date reports per run"
        required: true
        default: "120"
  schedule:
    # 10:05 JST
    - cron: "5 1 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: juggler-daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect history, score picks, and evaluate prior picks
        run: >
          python juggler_daily.py
          --delay "${{ github.event.inputs.delay_seconds || '5' }}"
          --backfill-days "${{ github.event.inputs.backfill_days || '365' }}"
          --max-new-reports "${{ github.event.inputs.max_new_reports || '120' }}"

      - name: Build mobile site index
        run: python build_site.py

      - name: Commit daily data and reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/juggler_history.csv data/juggler_predictions.csv
          git add reports/juggler_analysis.md reports/juggler_picks.md
          git add site/juggler_analysis.html site/juggler_picks.html site/index.html
          if git diff --cached --quiet; then
            echo "No daily Juggler changes to commit."
          else
            git commit -m "Update daily Juggler analysis and picks"
            git pull --rebase -X theirs
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/deploy-pages@v4
