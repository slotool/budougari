name: daily juggler analysis and picks

on:
  workflow_dispatch:
    inputs:
      delay_seconds:
        description: "Fetch delay seconds"
        required: true
        default: "5"
      backfill_days:
        description: "Lookback window for missing reports"
        required: true
        default: "365"
      max_new_reports:
        description: "Maximum hall-date reports per checkpoint batch"
        required: true
        default: "30"
  push:
    branches:
      - main
    paths:
      - "juggler_daily.py"
      - ".github/workflows/juggler-daily.yml"
  schedule:
    # 10:05 JST
    - cron: "5 1 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: juggler-daily
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect and checkpoint history in batches
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          status_file="data/juggler_backfill_status.txt"
          log_file="data/juggler_backfill_last.log"

          commit_status() {
            local message="$1"
            git add "${status_file}"
            if ! git diff --cached --quiet; then
              git commit -m "${message}"
              git pull --rebase -X theirs
              git push
            fi
          }

          on_error() {
            local exit_code="$1"
            local failed_command="$2"
            trap - ERR
            set +e
            {
              printf 'state=failed\nexit_code=%s\ncommand=%s\nupdated_at=%s\n' \
                "${exit_code}" "${failed_command}" "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
              if [[ -f "${log_file}" ]]; then
                printf '\nlast_log:\n'
                tail -n 30 "${log_file}"
              fi
            } > "${status_file}"
            git add data/juggler_catalog_debug.json data/juggler_report_catalog.json 2>/dev/null || true
            commit_status "Juggler backfill failed"
            exit "${exit_code}"
          }
          trap 'on_error $? "$BASH_COMMAND"' ERR

          mkdir -p data
          printf 'state=running\nbatch=0\nupdated_at=%s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > "${status_file}"
          commit_status "Start checkpointed Juggler backfill"

          for batch in $(seq 1 9); do
            if [[ -f data/juggler_history.csv ]]; then
              before=$(wc -l < data/juggler_history.csv)
            else
              before=0
            fi

            printf 'state=running\nbatch=%s\nrows_before=%s\nupdated_at=%s\n' \
              "${batch}" "${before}" "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > "${status_file}"
            commit_status "Start Juggler backfill batch ${batch}"

            python juggler_daily.py \
              --delay "${{ github.event.inputs.delay_seconds || '5' }}" \
              --backfill-days "${{ github.event.inputs.backfill_days || '365' }}" \
              --max-new-reports "${{ github.event.inputs.max_new_reports || '30' }}" \
              2>&1 | tee "${log_file}"
            python build_site.py
            after=$(wc -l < data/juggler_history.csv)

            git add data/juggler_history.csv data/juggler_predictions.csv
            git add data/juggler_catalog_debug.json
            git add data/juggler_report_catalog.json
            git add "${status_file}"
            git add reports/juggler_analysis.md reports/juggler_picks.md
            git add site/juggler_analysis.html site/juggler_picks.html site/index.html
            printf 'state=running\nbatch=%s\nrows_before=%s\nrows_after=%s\nupdated_at=%s\n' \
              "${batch}" "${before}" "${after}" "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > "${status_file}"
            git add "${status_file}"
            if ! git diff --cached --quiet; then
              git commit -m "Backfill Juggler history batch ${batch}"
              git pull --rebase -X theirs
              git push
            fi

            echo "batch=${batch} rows_before=${before} rows_after=${after}"
            if [[ "${after}" -le "${before}" ]]; then
              break
            fi
          done

          trap - ERR
          printf 'state=complete\nupdated_at=%s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > "${status_file}"
          commit_status "Complete checkpointed Juggler backfill"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/deploy-pages@v4
